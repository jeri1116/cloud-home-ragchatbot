name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install boto3 cfn-lint
      - name: 단위 테스트
        run: python -m unittest discover -s tests -v
      - name: CloudFormation 템플릿 검사
        run: cfn-lint template.yaml
